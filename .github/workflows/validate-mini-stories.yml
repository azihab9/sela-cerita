name: Validate Mini Stories

on:
  pull_request:
    branches: [main, feat/mini-stories-foundation]
  push:
    branches: [feat/mini-stories-guided-editor]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check app/auth.js
          node --check app/dashboard.js
          node --check app/mini-stories-editor.js
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check R2 Edge Function
        run: deno check supabase/functions/r2-media/index.ts
